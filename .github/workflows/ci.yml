name: FiveStar CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "development" ]
  pull_request:
    branches: [ "main", "master", "development" ]

jobs:
  lint-and-validate:
    name: Code Lint & Validation
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, mysqli, json, mbstring
          coverage: none

      - name: PHP Syntax Check (Lint)
        run: |
          echo "Running parallel PHP syntax check on all controller and view files..."
          find app -type f -name "*.php" -print0 | xargs -0 -n 1 -P 4 php -l

  docker-build:
    name: Docker Build Validation
    runs-on: self-hosted
    needs: lint-and-validate
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Mock Env File
        run: |
          echo "COMPOSE_PROJECT_NAME=fiverst" > .env
          echo "DB_HOST=db" >> .env
          echo "DB_NAME=fiverst" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASS=rootpassword" >> .env
          echo "DB_PORT=3306" >> .env
          echo "WEB_PORT=8085" >> .env
          echo "DB_HOST_PORT=3309" >> .env
          echo "CLOUDFLARE_TOKEN=mock_token_for_validation" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Services
        run: |
          docker compose build

  deploy:
    name: Continuous Deployment to VPS
    runs-on: self-hosted
    needs: docker-build
    # Only deploy when pushing to main or master branch
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FIVERSTIP }}
          username: ${{ secrets.FIVERSTVPSUSERNAME }}
          key: ${{ secrets.FIVERSTVPSSSHKEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "======================================================="
            echo "🚀 Starting Deployment to VPS..."
            echo "======================================================="
            
            # Navigate to the project directory
            cd /home/fadlan/fiverst || { echo "Directory not found!"; exit 1; }
            
            echo "📥 Pulling latest changes from GitHub..."
            git pull origin ${{ github.ref_name }}
            
            echo "🧹 Stopping legacy compose network and orphans..."
            docker compose down --remove-orphans
            
            echo "🏗️ Rebuilding and starting Docker services..."
            docker compose up -d --build
            
            echo "======================================================="
            echo "✅ Deployment Completed Successfully with Zero Downtime!"
            echo "======================================================="
